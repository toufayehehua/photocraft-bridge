<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 16px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); font: 12px Inter, system-ui, sans-serif; }
    label { display: block; margin-bottom: 8px; }
    input { box-sizing: border-box; width: 100%; height: 32px; padding: 0 8px; color: inherit; background: inherit; border: 1px solid var(--figma-color-border, #ccc); border-radius: 4px; }
    .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    button { padding: 7px 18px; color: var(--figma-color-text-onbrand, #fff); background: var(--figma-color-bg-brand, #0d99ff); border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    a { color: var(--figma-color-text-brand, #0875ca); text-decoration: none; }
    #error { min-height: 28px; margin-top: 10px; color: var(--figma-color-text-danger, #c33); }
  </style>
</head>
<body>
  <form id="pair">
    <label for="token">配对码</label>
    <input id="token" type="password" pattern="[0-9a-fA-F]{64}" maxlength="64" required autocomplete="off" spellcheck="false" autofocus>
    <div class="actions">
      <a href="https://github.com/toufayehehua/photocraft-bridge/releases" target="_blank" rel="noopener noreferrer">安装桥接</a>
      <button id="connect" type="submit">连接</button>
    </div>
    <div id="error" role="alert"></div>
  </form>
  <script>
    const token = document.getElementById("token");
    const connect = document.getElementById("connect");
    const error = document.getElementById("error");
    document.getElementById("pair").onsubmit = event => {
      event.preventDefault();
      error.textContent = "";
      connect.disabled = token.disabled = true;
      parent.postMessage({ pluginMessage: { type: "pair", token: token.value.trim() } }, "*");
    };
    window.onmessage = event => {
      const message = event.data && event.data.pluginMessage;
      if (!message || message.type !== "pair-error") return;
      error.textContent = message.message;
      connect.disabled = token.disabled = false;
      token.focus();
    };
  </script>
</body>
</html>
